services:
  backend:
    build: ./backend
    container_name: backend
    env_file:
      - .env
    expose:
      - "8080"
    networks:
      - appnet

  nginx:
    image: nginx:stable
    env_file:
      - .env
    container_name: nginx
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
